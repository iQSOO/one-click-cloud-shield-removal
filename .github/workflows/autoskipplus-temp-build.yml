name: AutoSkipPlus temporary APK build

on:
  push:
    branches:
      - build/autoskipplus-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Reconstruct and correct transferred source
        run: |
          cat autoskipplus-build/chunk_*.b64 > AutoSkipPlus-source.zip.b64
          base64 -d AutoSkipPlus-source.zip.b64 > AutoSkipPlus-source.zip
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AutoSkipPlus-source.zip')
          b = bytearray(p.read_bytes())
          if len(b) != 40716:
              raise SystemExit(f'unexpected transferred size: {len(b)}')
          b[27114:27116] = bytes.fromhex('8a28')
          del b[36012:36024]
          p.write_bytes(b)
          print('corrected size:', len(b))
          PY
          echo '19d2f512cc7591f82b33cc4bf0ad107e658bcb6f0bc38a5c529897cc18802198  AutoSkipPlus-source.zip' | sha256sum -c -
          unzip -t AutoSkipPlus-source.zip
          unzip -q AutoSkipPlus-source.zip

      - name: Apply rule center v1.0.1 patch
        working-directory: AutoSkipPlus
        run: |
          patch --batch -p1 < ../autoskipplus-patch/rules_ui_v101.patch
          grep -n "versionName '1.0.1'" app/build.gradle
          grep -n 'TextView edit = actionText("编辑"' app/src/main/java/com/iqsoo/autoskip/RulesActivity.java
          grep -n 'Button delete = Ui.secondaryButton(this, "删除此规则")' app/src/main/java/com/iqsoo/autoskip/RuleEditActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: AutoSkipPlus
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f AutoSkipPlus/app/build/outputs/apk/debug/app-debug.apk
          ls -lh AutoSkipPlus/app/build/outputs/apk/debug/app-debug.apk
          sha256sum AutoSkipPlus/app/build/outputs/apk/debug/app-debug.apk
          unzip -t AutoSkipPlus/app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoSkipPlus-v1.0.1-debug-apk
          path: AutoSkipPlus/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
