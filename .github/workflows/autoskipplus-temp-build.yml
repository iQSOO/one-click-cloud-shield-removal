name: AutoSkipPlus temporary APK build

on:
  push:
    branches:
      - build/autoskipplus-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct source archive
        run: |
          cat autoskipplus-build/chunk_*.b64 > AutoSkipPlus-source.zip.b64
          base64 -d AutoSkipPlus-source.zip.b64 > AutoSkipPlus-source.zip
          echo '19d2f512cc7591f82b33cc4bf0ad107e658bcb6f0bc38a5c529897cc18802198  AutoSkipPlus-source.zip' | sha256sum -c -
          unzip -q AutoSkipPlus-source.zip

      - name: Build debug APK
        working-directory: AutoSkipPlus
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f AutoSkipPlus/app/build/outputs/apk/debug/app-debug.apk
          ls -lh AutoSkipPlus/app/build/outputs/apk/debug/app-debug.apk
          sha256sum AutoSkipPlus/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoSkipPlus-debug-apk
          path: AutoSkipPlus/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
